name: Production canary
# Runs health check + i18n audit against PRODUCTION after every push to master.
# Catches deploys that succeeded on Vercel's side but produce broken pages
# (DB connection lost, env var missing, runtime error, etc.). Hourly cron
# catches regressions from external causes.

on:
  push:
    branches: [master, main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Wait for Vercel production deploy
        if: github.event_name == 'push'
        run: sleep 90
      - name: Run health check against production
        env:
          AUDIT_BASE_URL: https://klemortgage.com
        run: npm run health:check
      - name: Run i18n audit against production
        env:
          AUDIT_BASE_URL: https://klemortgage.com
        run: npm run i18n:audit
