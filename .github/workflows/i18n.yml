name: i18n audit
# Catches KLE Mortgage translation regressions BEFORE they reach production.
# Verifies every route x locale has unique <title>, <meta description>, <h1>,
# and JSON-LD schemas (MortgageBroker, Place) are valid.

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://klemortgage.com
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgres://placeholder' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'placeholder-32-chars-for-build-only' }}
      - name: Start production server
        run: |
          npm run start &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000/" 2>/dev/null | grep -qE "^(200|308)$"; then
              echo "Server up after ${i}s"
              break
            fi
            sleep 1
          done
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgres://placeholder' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'placeholder-32-chars-for-build-only' }}
      - name: Run i18n audit
        env:
          AUDIT_BASE_URL: http://localhost:3000
        run: npm run i18n:audit
      - name: Run health check
        env:
          AUDIT_BASE_URL: http://localhost:3000
        run: npm run health:check
